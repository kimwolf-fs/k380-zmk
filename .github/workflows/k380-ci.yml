name: K380 CI

on:
  push:
    paths:
      - ".github/workflows/k380-ci.yml"
      - "zmk-keyboard-k380/**"
      - "app/boards/kimwolf/k380/**"
      - "zmk-keyboard-k380/tests/board-build/**"
  pull_request:
    paths:
      - ".github/workflows/k380-ci.yml"
      - "zmk-keyboard-k380/**"
      - "app/boards/kimwolf/k380/**"
      - "zmk-keyboard-k380/tests/board-build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-metadata:
    runs-on: ubuntu-latest
    outputs:
      module-registered: ${{ steps.module.outputs.registered }}
    steps:
      - uses: actions/checkout@v7
      - id: module
        run: |
          if test -f zmk-keyboard-k380/zephyr/module.yml; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi

  ghost-filter:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-dev-arm:4.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-k380-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-k380-
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - run: ZEPHYR_TOOLCHAIN_VARIANT=host west twister -T zmk-keyboard-k380/tests/ghost-filter -p native_sim
      - run: ZEPHYR_TOOLCHAIN_VARIANT=host west twister -T zmk-keyboard-k380/tests/status-indicator -p native_sim
      - run: ZEPHYR_TOOLCHAIN_VARIANT=host west twister -T zmk-keyboard-k380/tests/ble-slot-policy -p native_sim
      - run: ZEPHYR_TOOLCHAIN_VARIANT=host west twister -T zmk-keyboard-k380/tests/battery-policy -p native_sim
      - run: ZEPHYR_TOOLCHAIN_VARIANT=host west twister -T zmk-keyboard-k380/tests/soft-off -p native_sim
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k380-ghost-filter-logs
          include-hidden-files: true
          path: |
            twister-out*/**/*.log
            twister-out*/**/zephyr/.config
          if-no-files-found: ignore

  driver-build:
    needs: module-metadata
    if: ${{ needs.module-metadata.outputs.module-registered == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-k380-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-k380-
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - run: |
          west build -s app -d build/k380-driver -p always -b nrf52840dk/nrf52840 -- \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-keyboard-k380" \
            -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/zmk-keyboard-k380/tests/driver-build/k380-driver.conf" \
            -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/zmk-keyboard-k380/tests/driver-build/k380-driver.overlay"
      - if: failure()
        run: |
          find build/k380-driver -type f -name '*.log' -print -exec tail -n 200 {} \;
      - run: |
          grep -q '^CONFIG_K380_KSCAN_NO_DIODE_MATRIX=y$' \
            build/k380-driver/zephyr/.config
          find build/k380-driver -name 'kscan_k380_no_diode_matrix.c.obj' \
            -print -quit | grep -q .
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k380-driver-build-output
          include-hidden-files: true
          path: |
            build/k380-driver/**/*.log
            build/k380-driver/**/zephyr/.config
            build/k380-driver/**/zephyr/zephyr.dts
          if-no-files-found: ignore

  board-build:
    needs: module-metadata
    if: ${{ needs.module-metadata.outputs.module-registered == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-k380-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-k380-
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - name: Validate K380 matrix controller prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("app/boards/kimwolf/k380/k380_nrf52840_zmk.dts").read_text()
          kscan_kconfig = Path("zmk-keyboard-k380/drivers/kscan/Kconfig").read_text()
          source = re.sub(r"/\*.*?\*/", "", source, flags=re.S)
          source = re.sub(r"//[^\n]*", "", source)
          normalized = re.sub(r"\s+", "", source)

          for symbol in (
              "ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS",
              "ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS",
          ):
              assert re.search(rf"(?m)^\s*config\s+{symbol}\s*$", kscan_kconfig), (
                  f"K380 custom matrix driver must define {symbol}; "
                  "defconfig assignments are not sufficient if the symbol is not visible"
              )

          transform = re.search(
              r"k380_transform\s*:\s*keymap_transform_0\s*\{(?P<body>.*?)\n\s*\};",
              source,
              re.S,
          )
          assert transform, "missing K380 physical layout transform"
          entries = [
              (int(row), int(col))
              for row, col in re.findall(r"\bRC\((\d+),(\d+)\)", transform.group("body"))
          ]
          coords = set(entries)
          assert len(entries) == 80, f"K380 transform must contain 80 keys, found {len(entries)}"
          assert len(coords) == 80, "K380 transform contains duplicate RC coordinates"
          for row, col in coords:
              assert 0 <= row < 8, f"K380 transform row out of range: RC({row},{col})"
              assert 0 <= col < 15, f"K380 transform column out of range: RC({row},{col})"
          assert (4, 7) in coords, "K380 transform must include Del recovery coordinate RC(4,7)"

          def matching_brace(dts, opening):
              depth = 0
              for index in range(opening, len(dts)):
                  if dts[index] == "{":
                      depth += 1
                  elif dts[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return index
              raise AssertionError("unterminated devicetree node")

          def direct_status(node_body):
              matches = []
              for match in re.finditer(r"(?m)^[ \t]*status\s*=", node_body):
                  depth = node_body[:match.start()].count("{") - node_body[:match.start()].count("}")
                  if depth == 0:
                      matches.append(match)
              assert len(matches) == 1, (
                  f"expected exactly one direct status property, found {len(matches)}"
              )
              value_end = node_body.find(";", matches[0].end())
              assert value_end >= 0, "unterminated status property"
              return node_body[matches[0].end():value_end]

          for node in ("gpio0", "gpio1", "gpiote"):
              match = re.search(rf"&{node}\s*\{{", source)
              assert match, f"missing {node} controller overlay"
              opening = source.find("{", match.start())
              closing = matching_brace(source, opening)
              assert re.fullmatch(
                  r'\s*"okay"\s*',
                  direct_status(source[opening + 1:closing]),
              ), f"{node} must be enabled for the K380 matrix"
          PY
      - run: |
          west build -s app -d build/k380-board -p always -b k380/nrf52840/zmk -- \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-keyboard-k380" \
            -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/zmk-keyboard-k380/tests/board-build/k380-board.conf" \
            -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/zmk-keyboard-k380/tests/board-build/k380-board.overlay"
      - name: Validate K380 board contract
        shell: bash
        run: |
          set +e
          python3 - <<'PY' 2>contract_failure.log
          from pathlib import Path
          import re
          import struct

          source = Path("app/boards/kimwolf/k380/k380_nrf52840_zmk.dts").read_text()
          generated = Path("build/k380-board/zephyr/zephyr.dts").read_text()
          source_without_comments = re.sub(r"/\*.*?\*/", "", source, flags=re.S)
          source_without_comments = re.sub(r"//[^\n]*", "", source_without_comments)
          normalized = re.sub(r"\s+", "", source_without_comments)

          for required in (
              "#include<nordic/nrf52840_qiaa.dtsi>",
              "#include<common/nordic/nrf52840_uf2_boot_mode.dtsi>",
              "#include<zephyr/dt-bindings/regulator/nrf5x.h>",
              "zephyr,code-partition=&code_partition;",
          ):
              assert required in normalized, f"missing source contract: {required}"

          reg1 = re.search(r"&reg1\s*\{(?P<body>[^}]*)\};", source_without_comments, re.S)
          assert reg1 and re.search(
              r"\bregulator-initial-mode\s*=\s*<\s*NRF5X_REG_MODE_DCDC\s*>\s*;",
              reg1.group("body"),
          ), "reg1 must enable DCDC"

          for forbidden in (
              "pwm-leds",
          ):
              assert forbidden not in normalized, f"forbidden source content: {forbidden}"
          chosen_source = re.search(r"chosen\s*\{(?P<body>[^}]*)\};", source_without_comments, re.S)
          assert chosen_source and "zmk,matrix-transform" not in chosen_source.group("body"), (
              "chosen zmk,matrix-transform must not be used; K380 uses the physical layout transform"
          )
          assert re.search(
              r"\bzmk,battery\s*=\s*&k380_vddh_battery\s*;",
              chosen_source.group("body"),
          ), "chosen zmk,battery must point to the K380 VDDH SAADC battery"
          assert re.search(
              r"\bzmk,underglow\s*=\s*&k380_ws2812\s*;",
              chosen_source.group("body"),
          ), "chosen zmk,underglow must point to k380_ws2812"
          assert not re.search(r"<\s*&gpio0\s+13\b", source_without_comments), (
              "P0.13 must not be assigned as a GPIO in the board DTS"
          )
          reg0 = re.search(r"&reg0\s*\{(?P<body>[^}]*)\};", source_without_comments, re.S)
          assert not reg0 or not re.search(
              r"\bregulator-initial-mode\s*=\s*<\s*NRF5X_REG_MODE_DCDC\s*>\s*;",
              reg0.group("body"),
          ), "reg0 must not enable DCDC"

          expected_rows = (
              ("gpio1", 9, 0x02),
              ("gpio0", 26, 0x02),
              ("gpio0", 6, 0x02),
              ("gpio0", 8, 0x02),
              ("gpio0", 4, 0x02),
              ("gpio0", 12, 0x02),
              ("gpio0", 7, 0x02),
              ("gpio0", 15, 0x02),
          )
          expected_cols = (
              ("gpio0", 5, 0x20),
              ("gpio0", 17, 0x20),
              ("gpio0", 20, 0x20),
              ("gpio0", 22, 0x20),
              ("gpio1", 2, 0x20),
              ("gpio1", 4, 0x20),
              ("gpio1", 6, 0x20),
              ("gpio0", 31, 0x20),
              ("gpio0", 29, 0x20),
              ("gpio0", 2, 0x20),
              ("gpio1", 13, 0x20),
              ("gpio0", 28, 0x20),
              ("gpio0", 3, 0x20),
              ("gpio1", 10, 0x20),
              ("gpio1", 11, 0x20),
          )
          gpio_flag_values = {
              "GPIO_ACTIVE_HIGH": 0x00,
              "GPIO_ACTIVE_LOW": 0x01,
              "GPIO_OPEN_DRAIN": 0x06,
              "GPIO_OPEN_SOURCE": 0x02,
              "GPIO_DISCONNECTED": 0x08,
              "GPIO_PULL_UP": 0x10,
              "GPIO_PULL_DOWN": 0x20,
          }

          node_declaration = re.compile(
              r"(?m)^[ \t]*(?:(?P<label>[A-Za-z_][A-Za-z0-9_-]*)\s*:\s*)?"
              r"(?P<node_name>/|[A-Za-z_][A-Za-z0-9_,-]*)\s*\{"
          )

          def brace_depth(dts, index):
              return dts[:index].count("{") - dts[:index].count("}")

          def matching_brace(dts, opening):
              depth = 0
              for index in range(opening, len(dts)):
                  if dts[index] == "{":
                      depth += 1
                  elif dts[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return index
              raise AssertionError("unterminated devicetree node")

          def extract_root_node(dts, node_name, required_label=None):
              root = re.search(r"(?m)^[ \t]*/\s*\{", dts)
              assert root, "missing devicetree root node"
              root_opening = dts.find("{", root.start())
              root_closing = matching_brace(dts, root_opening)
              candidates = []
              for match in node_declaration.finditer(
                  dts, root_opening + 1, root_closing
              ):
                  if match.group("node_name") != node_name:
                      continue
                  opening = dts.find("{", match.start())
                  closing = matching_brace(dts, opening)
                  candidates.append((brace_depth(dts, match.start()), match, opening, closing))
              assert len(candidates) == 1, (
                  f"expected exactly one {node_name} node, found {len(candidates)}"
              )
              depth, match, opening, closing = candidates[0]
              assert depth == 1, f"{node_name} must be a root-level node"
              if required_label is not None:
                  assert match.group("label") == required_label, (
                      f"{node_name} must use label {required_label}"
                  )
              return dts[opening + 1:closing]

          def parse_gpio_flags(flag_text):
              flags = 0
              symbolic_flags = re.findall(r"\bGPIO_[A-Z_]+\b", flag_text)
              numeric_flags = re.findall(r"\b(?:0x[0-9a-fA-F]+|[0-9]+)\b", flag_text)
              assert symbolic_flags or numeric_flags, f"missing GPIO flags: {flag_text!r}"
              for flag in symbolic_flags:
                  assert flag in gpio_flag_values, f"unknown GPIO flag: {flag}"
                  flags |= gpio_flag_values[flag]
              for flag in numeric_flags:
                  flags |= int(flag, 0)
              return flags

          def parse_direct_property(node_body, property_name):
              matches = []
              for match in re.finditer(
                  rf"(?m)^[ \t]*{re.escape(property_name)}\s*=",
                  node_body,
              ):
                  if brace_depth(node_body, match.start()) == 0:
                      matches.append(match)
              assert len(matches) == 1, (
                  f"expected exactly one direct {property_name}, found {len(matches)}"
              )
              match = matches[0]
              value_end = node_body.find(";", match.end())
              assert value_end >= 0, f"unterminated {property_name}"
              return node_body[match.end():value_end]

          def extract_overlay_node(dts, node_ref):
              match = re.search(rf"&{re.escape(node_ref)}\s*\{{", dts)
              assert match, f"missing {node_ref} overlay"
              opening = dts.find("{", match.start())
              closing = matching_brace(dts, opening)
              return dts[opening + 1:closing]

          def extract_labeled_node(dts, label, node_name):
              match = re.search(
                  rf"(?m)^[ \t]*{re.escape(label)}\s*:\s*"
                  rf"{re.escape(node_name)}\s*\{{",
                  dts,
              )
              assert match, f"missing {label}: {node_name} node"
              opening = dts.find("{", match.start())
              closing = matching_brace(dts, opening)
              return dts[opening + 1:closing]

          def assert_ws2812_source_contract(dts):
              spi3 = extract_overlay_node(dts, "spi3")
              assert re.search(
                  r'\bcompatible\s*=\s*"nordic,nrf-spim"\s*;',
                  spi3,
              ), "K380 WS2812B must use nRF SPIM"
              assert re.search(
                  r"\bpinctrl-0\s*=\s*<\s*&spi3_default\s*>\s*;",
                  spi3,
              ), "K380 WS2812B SPI default pinctrl is missing"
              assert re.search(
                  r"\bpinctrl-1\s*=\s*<\s*&spi3_sleep\s*>\s*;",
                  spi3,
              ), "K380 WS2812B SPI sleep pinctrl is missing"
              assert re.search(
                  r"\bpsels\s*=\s*<\s*NRF_PSEL\s*\(\s*SPIM_MOSI\s*,\s*0\s*,\s*13\s*\)\s*>\s*;",
                  extract_labeled_node(dts, "spi3_default", "spi3_default"),
              ), "K380 WS2812B data pin must be P0.13 in default pinctrl"
              assert re.search(
                  r"\bpsels\s*=\s*<\s*NRF_PSEL\s*\(\s*SPIM_MOSI\s*,\s*0\s*,\s*13\s*\)\s*>\s*;",
                  extract_labeled_node(dts, "spi3_sleep", "spi3_sleep"),
              ), "K380 WS2812B data pin must be P0.13 in sleep pinctrl"

              ws = extract_labeled_node(dts, "k380_ws2812", "ws2812@0")
              assert re.search(
                  r'\bcompatible\s*=\s*"worldsemi,ws2812-spi"\s*;',
                  ws,
              ), "K380 WS2812B compatible must be worldsemi,ws2812-spi"
              assert re.search(r"\bchain-length\s*=\s*<\s*4\s*>\s*;", ws), (
                  "K380 WS2812B chain length must be 4"
              )
              assert re.search(r"\breset-delay\s*=\s*<\s*80\s*>\s*;", ws), (
                  "K380 WS2812B reset delay must be explicitly set to 80 us"
              )
              assert "LED_COLOR_ID_GREEN" in ws and "LED_COLOR_ID_RED" in ws and (
                  "LED_COLOR_ID_BLUE" in ws
              ), "K380 WS2812B color mapping must be present"

              p013_psels = re.findall(
                  r"NRF_PSEL\s*\(\s*([^,]+)\s*,\s*0\s*,\s*13\s*\)", dts
              )
              assert p013_psels == ["SPIM_MOSI", "SPIM_MOSI"], (
                  "P0.13 source ownership must be limited to the two WS2812B SPIM_MOSI pinctrl states"
              )

          vddh_battery = extract_root_node(
              source_without_comments, "battery", required_label="k380_vddh_battery"
          )
          assert re.fullmatch(
              r'\s*"zmk,battery-nrf-vddh"\s*',
              parse_direct_property(vddh_battery, "compatible"),
          ), "K380 battery must use the VDDH SAADC compatible"
          assert re.fullmatch(
              r'\s*"okay"\s*', parse_direct_property(vddh_battery, "status")
          ), "K380 VDDH SAADC battery must be enabled"

          assert_ws2812_source_contract(source_without_comments)

          def parse_gpio_property(node_body, property_name):
              value = parse_direct_property(node_body, property_name)
              entries = []
              for entry in re.findall(r"<([^>]*)>", value):
                  controller = re.search(r"&([A-Za-z0-9_]+)", entry)
                  assert controller, f"missing GPIO controller: {entry!r}"
                  tail = entry[controller.end():]
                  pin = re.search(r"\b(?:0x[0-9a-fA-F]+|[0-9]+)\b", tail)
                  assert pin, f"missing GPIO pin: {entry!r}"
                  flags = parse_gpio_flags(tail[pin.end():])
                  entries.append((controller.group(1), int(pin.group(0), 0), flags))
              return entries

          def assert_kscan_contract(dts, name):
              assert dts.count('compatible = "k380,kscan-no-diode-matrix";') == 1, (
                  f"{name} must contain exactly one K380 kscan compatible"
              )
              chosen = extract_root_node(dts, "chosen")
              assert re.fullmatch(
                  r"\s*&k380_kscan\s*", parse_direct_property(chosen, "zmk,kscan")
              ), (
                  f"{name} /chosen zmk,kscan must point to k380_kscan"
              )
              node = extract_root_node(dts, "k380_kscan", required_label="k380_kscan")
              assert re.fullmatch(
                  r'\s*"k380,kscan-no-diode-matrix"\s*',
                  parse_direct_property(node, "compatible"),
              ), f"{name} k380_kscan has the wrong compatible"
              rows = parse_gpio_property(node, "row-gpios")
              cols = parse_gpio_property(node, "col-gpios")
              assert rows == list(expected_rows), f"{name} row GPIO contract mismatch: {rows!r}"
              assert cols == list(expected_cols), f"{name} col GPIO contract mismatch: {cols!r}"

          assert_kscan_contract(source_without_comments, "source")
          assert_kscan_contract(generated, "generated")

          expected_partitions = {
              0x00000: (0x00000, 0x26000, True),
              0x26000: (0x26000, 0xA4000, False),
              0xCA000: (0xCA000, 0x20000, False),
              0xEA000: (0xEA000, 0x0A000, True),
              0xF4000: (0xF4000, 0x0C000, True),
          }
          def parse_partitions(dts):
              partitions = {}
              for address, body in re.findall(
                  r"partition@([0-9a-fA-F]+)\s*\{(.*?)\n\s*\};", dts, re.S
              ):
                  reg = re.search(
                      r"reg\s*=\s*<\s*(0x[0-9a-fA-F]+)\s+(0x[0-9a-fA-F]+)\s*>\s*;",
                      body,
                  )
                  if reg:
                      partitions[int(address, 16)] = (
                          int(reg.group(1), 16),
                          int(reg.group(2), 16),
                          bool(re.search(r"\bread-only\s*;", body)),
                      )
              return partitions

          for name, dts in (("source", source), ("generated", generated)):
              assert parse_partitions(dts) == expected_partitions, (
                  f"{name} partition contract mismatch: {parse_partitions(dts)!r}"
              )

          app_start, app_end = 0x26000, 0xCA000

          def assert_application_range(start, size, artifact):
              if start < 0x00100000:
                  assert app_start <= start and start + size <= app_end, (
                      f"{artifact} range {start:#x}-{start + size:#x} is outside "
                      f"the application partition"
                  )

          hex_base = 0
          hex_ranges = []
          for line in Path("build/k380-board/zephyr/zmk.hex").read_text().splitlines():
              assert line.startswith(":"), f"invalid Intel HEX record: {line!r}"
              record = bytes.fromhex(line[1:])
              assert len(record) == record[0] + 5, f"invalid Intel HEX length: {line!r}"
              assert sum(record) & 0xFF == 0, f"invalid Intel HEX checksum: {line!r}"
              count, offset, record_type = record[0], (record[1] << 8) | record[2], record[3]
              data = record[4:-1]
              if record_type == 0x00:
                  start, end = hex_base + offset, hex_base + offset + count
                  if start < 0x00100000:
                      assert start < end, f"empty Intel HEX range: {line!r}"
                      assert_application_range(start, count, "Intel HEX")
                      hex_ranges.append((start, end))
              elif record_type == 0x02:
                  assert count == 2, f"invalid Intel HEX segment record: {line!r}"
                  hex_base = int.from_bytes(data, "big") << 4
              elif record_type == 0x04:
                  assert count == 2, f"invalid Intel HEX linear record: {line!r}"
                  hex_base = int.from_bytes(data, "big") << 16
          assert hex_ranges, "Intel HEX contains no internal Flash data records"

          uf2 = Path("build/k380-board/zephyr/zmk.uf2").read_bytes()
          assert len(uf2) % 512 == 0, "UF2 is not composed of 512-byte blocks"
          uf2_ranges = []
          for index in range(0, len(uf2), 512):
              block = uf2[index:index + 512]
              magic0, magic1, _, target, payload_size, _, _, _ = struct.unpack_from(
                  "<8I", block
              )
              assert (magic0, magic1) == (0x0A324655, 0x9E5D5157), (
                  f"invalid UF2 header in block {index // 512}"
              )
              assert struct.unpack_from("<I", block, 508)[0] == 0x0AB16F30, (
                  f"invalid UF2 footer in block {index // 512}"
              )
              assert 0 < payload_size <= 476, (
                  f"invalid UF2 payload in block {index // 512}"
              )
              if target < 0x00100000:
                  end = target + payload_size
                  assert target < end, f"empty UF2 range in block {index // 512}"
                  assert_application_range(target, payload_size, "UF2")
                  uf2_ranges.append((target, end))
          assert uf2_ranges, "UF2 contains no internal Flash data blocks"
          PY
          validator_status=$?
          set -e
          if [ "$validator_status" -ne 0 ]; then
            failure="$(tail -n 1 contract_failure.log)"
            failure="${failure//'%'/'%25'}"
            failure="${failure//$'\r'/'%0D'}"
            failure="${failure//$'\n'/'%0A'}"
            echo "::error title=K380 board contract assertion::$failure"
            cat contract_failure.log >&2
            exit "$validator_status"
          fi
      - name: Diagnose K380 board contract failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import struct

          print("=== K380 board contract diagnostics ===")

          def escape_annotation(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def notice(title, value):
              print(f"::notice title={escape_annotation(title)}::{escape_annotation(value)}")

          def matching_brace(dts, opening):
              depth = 0
              for index in range(opening, len(dts)):
                  if dts[index] == "{":
                      depth += 1
                  elif dts[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return index
              return None

          def print_node(dts, node_name):
              match = re.search(
                  rf"(?m)^[ \t]*(?:[A-Za-z_][A-Za-z0-9_-]*\s*:\s*)?"
                  rf"{re.escape(node_name)}\s*\{{",
                  dts,
              )
              if not match:
                  print(f"--- {node_name}: missing ---")
                  notice(f"K380 {node_name}", "missing")
                  return
              opening = dts.find("{", match.start())
              closing = matching_brace(dts, opening)
              node = (
                  dts[match.start():closing + 2]
                  if closing is not None
                  else dts[match.start():]
              )
              print(f"--- {node_name} ---")
              print(node)
              notice(f"K380 {node_name}", re.sub(r"\s+", " ", node))

          def internal_hex_ranges(path):
              base = 0
              ranges = []
              for line in path.read_text().splitlines():
                  if not line.startswith(":"):
                      continue
                  record = bytes.fromhex(line[1:])
                  count = record[0]
                  offset = (record[1] << 8) | record[2]
                  record_type = record[3]
                  data = record[4:-1]
                  if record_type == 0x00:
                      start = base + offset
                      if start < 0x00100000 and count:
                          ranges.append((start, start + count))
                  elif record_type == 0x02 and len(data) == 2:
                      base = int.from_bytes(data, "big") << 4
                  elif record_type == 0x04 and len(data) == 2:
                      base = int.from_bytes(data, "big") << 16
              return ranges

          def internal_uf2_ranges(path):
              ranges = []
              data = path.read_bytes()
              for index in range(0, len(data) - 511, 512):
                  _, _, _, target, payload_size, _, _, _ = struct.unpack_from(
                      "<8I", data, index
                  )
                  if target < 0x00100000 and payload_size:
                      ranges.append((target, target + payload_size))
              return ranges

          def print_ranges(label, ranges):
              print(f"--- {label} internal Flash ranges ({len(ranges)}) ---")
              for start, end in ranges:
                  print(f"{start:#010x}-{end:#010x}")
              notice(
                  f"K380 {label} ranges",
                  ", ".join(f"{start:#010x}-{end:#010x}" for start, end in ranges)
                  or "none",
              )

          build = Path("build/k380-board/zephyr")
          generated = build / "zephyr.dts"
          if generated.is_file():
              dts = generated.read_text()
              print_node(dts, "chosen")
              print_node(dts, "k380_kscan")
              print("--- generated fixed partitions ---")
              partitions = re.findall(
                  r"partition@[0-9a-fA-F]+\s*\{.*?\n\s*\};", dts, re.S
              )
              for partition in partitions:
                  print(partition)
              notice(
                  "K380 generated fixed partitions",
                  " | ".join(re.sub(r"\s+", " ", partition) for partition in partitions)
                  or "none",
              )
          else:
              print("--- generated DTS: missing ---")
              notice("K380 generated DTS", "missing")

          hex_path = build / "zmk.hex"
          if hex_path.is_file():
              print_ranges("Intel HEX", internal_hex_ranges(hex_path))
          else:
              print("--- Intel HEX: missing ---")
              notice("K380 Intel HEX", "missing")

          uf2_path = build / "zmk.uf2"
          if uf2_path.is_file():
              print_ranges("UF2", internal_uf2_ranges(uf2_path))
          else:
              print("--- UF2: missing ---")
              notice("K380 UF2", "missing")
          PY
      - if: failure()
        run: |
          find build/k380-board -type f -name '*.log' -print -exec tail -n 200 {} \;
      - name: Validate K380 diagnostics are opt-in
        run: |
          test -f build/k380-board/zephyr/.config
          set +e
          grep -q '^CONFIG_K380_MATRIX_DIAGNOSTICS_RTT=y$' \
            build/k380-board/zephyr/.config
          config_status=$?
          set -e
          if [ "$config_status" -eq 0 ]; then
            echo "::error title=K380 diagnostics must be opt-in::CONFIG_K380_MATRIX_DIAGNOSTICS_RTT is enabled in the default board build"
            exit 1
          fi
          if [ "$config_status" -ne 1 ]; then
            echo "::error title=K380 diagnostics inspection failed::Unable to inspect K380 board .config"
            exit "$config_status"
          fi

          set +e
          grep -R "K380_MATRIX row=%u col=%u key=%s state=%s" \
            build/k380-board/zephyr >/tmp/k380_diag_string_matches.txt
          grep_status=$?
          set -e
          if [ "$grep_status" -eq 0 ]; then
            echo "::error title=K380 diagnostics must be opt-in::diagnostic RTT format string is present in the default board build"
            cat /tmp/k380_diag_string_matches.txt
            exit 1
          elif [ "$grep_status" -ne 1 ]; then
            exit "$grep_status"
          fi

          set +e
          grep -R "K380_RTT_DIRECT_BOOT ready" \
            build/k380-board/zephyr >/tmp/k380_direct_rtt_matches.txt
          direct_status=$?
          set -e
          if [ "$direct_status" -eq 0 ]; then
            echo "::error title=K380 diagnostics must be opt-in::direct RTT boot probe string is present in the default board build"
            cat /tmp/k380_direct_rtt_matches.txt
            exit 1
          elif [ "$direct_status" -ne 1 ]; then
            exit "$direct_status"
          fi

          set +e
          grep -R "K380_RTT_DIRECT_HEARTBEAT" \
            build/k380-board/zephyr >/tmp/k380_direct_heartbeat_matches.txt
          heartbeat_status=$?
          set -e
          if [ "$heartbeat_status" -eq 0 ]; then
            echo "::error title=K380 diagnostics must be opt-in::direct RTT heartbeat string is present in the default board build"
            cat /tmp/k380_direct_heartbeat_matches.txt
            exit 1
          elif [ "$heartbeat_status" -ne 1 ]; then
            exit "$heartbeat_status"
          fi

          set +e
          grep -R "k380_kscan_diag_snapshot" \
            build/k380-board/zephyr >/tmp/k380_diag_snapshot_matches.txt
          snapshot_status=$?
          set -e
          if [ "$snapshot_status" -eq 0 ]; then
            echo "::error title=K380 diagnostics must be opt-in::diagnostic RAM snapshot symbol is present in the default board build"
            cat /tmp/k380_diag_snapshot_matches.txt
            exit 1
          elif [ "$snapshot_status" -ne 1 ]; then
            exit "$snapshot_status"
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k380-board-build-output
          include-hidden-files: true
          path: |
            build/k380-board/**/*.log
            build/k380-board/**/zephyr/.config
            build/k380-board/**/zephyr/zephyr.dts
            build/k380-board/**/zephyr/zmk.elf
            build/k380-board/**/zephyr/zephyr.elf
            build/k380-board/**/zephyr/zmk.map
            build/k380-board/**/zephyr/zephyr.map
            build/k380-board/**/zephyr/zmk.hex
            build/k380-board/**/zephyr/zmk.uf2
          if-no-files-found: ignore

  firmware-build:
    needs: module-metadata
    if: ${{ needs.module-metadata.outputs.module-registered == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-k380-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-k380-
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - run: |
          west build -s app -d build/k380-firmware -p always -b k380/nrf52840/zmk \
            -S studio-rpc-usb-uart -- \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-keyboard-k380" \
            -DCONFIG_ZMK_STUDIO=y
      - name: Validate K380 firmware keymap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dts = Path("build/k380-firmware/zephyr/zephyr.dts").read_text()
          config = Path("build/k380-firmware/zephyr/.config").read_text()
          keymap = Path("app/boards/kimwolf/k380/k380.keymap").read_text()

          required_config = {
              "CONFIG_ZMK_KEYBOARD_NAME": '"K380-ZMK"',
              "CONFIG_BT_DEVICE_NAME": '"K380-ZMK-BLE"',
              "CONFIG_USB_DEVICE_PRODUCT": '"K380-ZMK-USB"',
              "CONFIG_ZMK_STUDIO": "y",
              "CONFIG_ZMK_STUDIO_TRANSPORT_UART": "y",
              "CONFIG_USB_CDC_ACM": "y",
              "CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS": "5",
              "CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS": "50",
          }
          for name, value in required_config.items():
              assert re.search(rf"(?m)^{name}={value}$", config), (
                  f"formal K380 firmware must set {name}={value}; "
                  "missing values mean the custom matrix settle delay is not active"
              )
          assert re.search(r"(?m)^# CONFIG_K380_MATRIX_DIAGNOSTICS_RTT is not set$", config), (
              "formal K380 firmware must not enable RTT matrix diagnostics"
          )
          assert re.search(r"(?m)^# CONFIG_ZMK_RGB_UNDERGLOW is not set$", config), (
              "formal K380 firmware must keep the standard ZMK RGB underglow owner disabled"
          )
          assert re.search(r"(?m)^CONFIG_K380_STATUS_INDICATOR=y$", config), (
              "formal K380 firmware must enable the K380 status indicator owner"
          )
          assert re.search(r"(?m)^# CONFIG_ZMK_KSCAN_MATRIX_POLLING is not set$", config), (
              "formal K380 firmware must use interrupt-driven scan wake, not matrix polling"
          )
          assert re.search(r"reset-delay\s*=\s*<\s*0x50\s*>\s*;", dts), (
              "formal K380 firmware must preserve an 80 us WS2812B reset delay"
          )
          assert "zmk,studio-rpc-uart" in dts, (
              "formal K380 firmware must expose the ZMK Studio USB UART RPC endpoint"
          )

          default = re.search(r"default_layer\s*\{(?P<body>.*?)\n\s*\};", dts, re.S)
          assert default, "generated firmware DTS is missing default_layer"
          default_bindings = re.search(r"bindings\s*=\s*<(?P<value>.*?)>\s*;", default.group("body"), re.S)
          assert default_bindings, "generated firmware default_layer is missing bindings"
          normalized_default = re.sub(r"\s+", " ", default_bindings.group("value")).strip()
          assert normalized_default != "&none", (
              "formal K380 firmware default_layer resolved to <&none>; "
              "do not flash board-build or diagnostic test artifacts as application firmware"
          )
          assert normalized_default.count("&kp") >= 60, "formal K380 firmware must carry the typing key layer"
          assert "&mo 0x1" in normalized_default, "formal K380 firmware must bind Fn as momentary layer 1"

          fn = re.search(r"fn_layer\s*\{(?P<body>.*?)\n\s*\};", dts, re.S)
          assert fn, "generated firmware DTS is missing fn_layer"
          fn_bindings = re.search(r"bindings\s*=\s*<(?P<value>.*?)>\s*;", fn.group("body"), re.S)
          assert fn_bindings, "generated firmware fn_layer is missing bindings"
          normalized_fn = re.sub(r"\s+", " ", fn_bindings.group("value")).strip()
          assert "&bootloader" in normalized_fn, "formal K380 firmware must keep Fn+Del bootloader binding"
          assert "&studio_unlock" in normalized_fn, (
              "formal K380 firmware must expose ZMK Studio unlock from the Fn layer"
          )
          for node in ("k380_bt_1", "k380_bt_2", "k380_bt_3"):
              assert f"&{node}" in normalized_fn, f"formal K380 firmware must keep {node} binding"

          assert "default_layer" in keymap and "&kp ESC" in keymap and "&kp DEL" in keymap, (
              "source K380 keymap must carry the normal typing layer"
          )
          assert re.search(
              r"(?m)^\s*&trans\s+&trans\s+&trans\s+&trans\s+&trans\s+&trans\s+&trans\s+"
              r"&trans\s+&trans\s+&trans\s+&trans\s+&trans\s+&trans\s+&studio_unlock\s*$",
              keymap,
          ), "source K380 keymap must bind Fn+Backspace to &studio_unlock"
          PY
      - if: failure()
        run: |
          find build/k380-firmware -type f -name '*.log' -print -exec tail -n 200 {} \;
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k380-zmk-firmware
          include-hidden-files: true
          path: |
            build/k380-firmware/**/*.log
            build/k380-firmware/**/zephyr/.config
            build/k380-firmware/**/zephyr/zephyr.dts
            build/k380-firmware/**/zephyr/zmk.elf
            build/k380-firmware/**/zephyr/zephyr.elf
            build/k380-firmware/**/zephyr/zmk.map
            build/k380-firmware/**/zephyr/zephyr.map
            build/k380-firmware/**/zephyr/zmk.hex
            build/k380-firmware/**/zephyr/zmk.uf2
          if-no-files-found: ignore

  matrix-rtt-diagnostics:
    needs: module-metadata
    if: ${{ needs.module-metadata.outputs.module-registered == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-k380-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-k380-
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - name: Validate K380 RTT diagnostic log format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "zmk-keyboard-k380/drivers/kscan/kscan_k380_no_diode_matrix.c"
          ).read_text()
          entries = re.findall(
              r'\[(?P<row>[0-7])\]\[(?P<col>[0-9]+)\]\s*=\s*"(?P<key>[^"]+)"',
              source,
          )
          coords = {(int(row), int(col)) for row, col, _ in entries}
          entry_set = {(int(row), int(col), key) for row, col, key in entries}
          assert len(entries) == 80, f"expected 80 key name entries, found {len(entries)}"
          assert len(coords) == 80, "duplicate K380 diagnostic key coordinates"
          for row, col in coords:
              assert 0 <= row < 8, f"K380 diagnostic row out of range: RC({row},{col})"
              assert 0 <= col < 15, f"K380 diagnostic column out of range: RC({row},{col})"
          assert (4, 7, "Del") in entry_set, "Del must be identified as RC(4,7)"
          assert (
              "K380_MATRIX row=%u col=%u key=%s state=%s\\n" in source
          ), "diagnostic matrix log must include key name"
          assert (
              'printk("%s", line)' not in source
          ), "diagnostic matrix events must not be duplicated through printk"
          PY
      - run: |
          west build -s app -d build/k380-matrix-rtt -p always -b k380/nrf52840/zmk -- \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-keyboard-k380" \
            -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/zmk-keyboard-k380/diagnostics/matrix-rtt/k380-matrix-rtt.conf"
      - run: |
          grep -q '^CONFIG_K380_MATRIX_DIAGNOSTICS_RTT=y$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^# CONFIG_K380_MATRIX_DIAGNOSTICS_RTT_HEARTBEAT is not set$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^CONFIG_ZMK_RTT_LOGGING=y$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^CONFIG_LOG_BACKEND_RTT=y$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^CONFIG_ZMK_LOGGING_MINIMAL=y$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^CONFIG_USE_SEGGER_RTT=y$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^CONFIG_PRINTK=y$' \
            build/k380-matrix-rtt/zephyr/.config
          grep -q '^CONFIG_LOG_PRINTK=y$' \
            build/k380-matrix-rtt/zephyr/.config
          if grep -q '^CONFIG_LOG_MODE_IMMEDIATE=y$' \
            build/k380-matrix-rtt/zephyr/.config; then
            echo "::error title=K380 RTT diagnostics must use deferred logging::CONFIG_LOG_MODE_IMMEDIATE is incompatible with the Bluetooth software Link Layer"
            exit 1
          fi
          if grep -q '^CONFIG_ZMK_USB_LOGGING=y$' \
            build/k380-matrix-rtt/zephyr/.config; then
            echo "::error title=K380 RTT diagnostics must not use USB logging::CONFIG_ZMK_USB_LOGGING is enabled"
            exit 1
          fi
          if grep -q '^CONFIG_USB_CDC_ACM=y$' \
            build/k380-matrix-rtt/zephyr/.config; then
            echo "::error title=K380 RTT diagnostics must not use USB CDC ACM::CONFIG_USB_CDC_ACM is enabled"
            exit 1
          fi
          grep -R "K380_MATRIX row=%u col=%u key=%s state=%s" \
            build/k380-matrix-rtt/zephyr
          grep -R "K380_RTT_DIRECT_BOOT ready" \
            build/k380-matrix-rtt/zephyr
          if grep -R "K380_RTT_DIRECT_HEARTBEAT" \
            build/k380-matrix-rtt/zephyr >/tmp/k380_heartbeat_matches.txt; then
            echo "::error title=K380 RTT diagnostics must be quiet by default::heartbeat output string is present"
            cat /tmp/k380_heartbeat_matches.txt
            exit 1
          fi
      - name: Generate K380 RTT diagnostic index
        run: |
          mkdir -p build/k380-matrix-rtt/diagnostics
          cp build/k380-matrix-rtt/zephyr/.config \
            build/k380-matrix-rtt/diagnostics/k380-matrix-rtt.config
          find build/k380-matrix-rtt -type f \( -name '*.elf' -o -name '*.map' \) \
            -print | sort > build/k380-matrix-rtt/diagnostics/k380-build-symbol-files.txt

          test -f build/k380-matrix-rtt/zephyr/zmk.map
          grep ' k380_kscan_diag_snapshot$' \
            build/k380-matrix-rtt/zephyr/zmk.map \
            > build/k380-matrix-rtt/diagnostics/k380-diagnostic-symbols.txt
          awk '
            / k380_kscan_diag_snapshot$/ {
              print "k380_kscan_diag_snapshot=" $1;
              print "jlink_mem32_command=mem32 " $1 " 16";
            }
          ' build/k380-matrix-rtt/diagnostics/k380-diagnostic-symbols.txt \
            > build/k380-matrix-rtt/diagnostics/k380-diagnostic-addresses.txt
          test -s build/k380-matrix-rtt/diagnostics/k380-diagnostic-addresses.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k380-matrix-rtt-diagnostics-output
          include-hidden-files: true
          path: |
            build/k380-matrix-rtt/**/*.log
            build/k380-matrix-rtt/diagnostics/**
            build/k380-matrix-rtt/**/zephyr/.config
            build/k380-matrix-rtt/**/zephyr/zephyr.dts
            build/k380-matrix-rtt/**/*.elf
            build/k380-matrix-rtt/**/*.map
            build/k380-matrix-rtt/**/zephyr/zmk.hex
            build/k380-matrix-rtt/**/zephyr/zmk.uf2
          if-no-files-found: ignore

  module-isolation:
    needs: module-metadata
    if: ${{ needs.module-metadata.outputs.module-registered == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-k380-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-k380-
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - working-directory: app
        run: |
          ZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-keyboard-k380" \
            ./run-test.sh tests/matrix-input/kp-press-release
          ! find build -name 'kscan_k380_no_diode_matrix.c.obj' -print -quit | grep -q .
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k380-module-isolation-logs
          include-hidden-files: true
          path: |
            app/build/**/*.log
          if-no-files-found: ignore
